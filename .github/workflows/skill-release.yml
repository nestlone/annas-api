name: Skill Release

# Packages the agent skill in skill/annas-api/ and publishes it as a GitHub
# Release tagged skill-v<version>. Bump skill/annas-api/VERSION to cut a release.

on:
  push:
    branches: [ main ]
    paths:
      - "skill/annas-api/**"
      - ".github/workflows/skill-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read skill version
        id: version
        run: |
          version="$(tr -d '[:space:]' < skill/annas-api/VERSION)"
          if [ -z "$version" ]; then
            echo "skill/annas-api/VERSION is empty" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=skill-v$version"
            echo "zip=annas-api-skill-$version.zip"
            echo "released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify version mirrors agree
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path("skill/annas-api")
          version = (root / "VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads((root / "skill.json").read_text(encoding="utf-8"))["version"]
          match = re.search(r'^\s*version:\s*"?([0-9][^"\s]*)"?\s*$',
                            (root / "SKILL.md").read_text(encoding="utf-8"), re.M)
          mirrors = {"skill.json": manifest, "SKILL.md": match.group(1) if match else None}
          mismatched = {name: value for name, value in mirrors.items() if value != version}
          if mismatched:
              sys.exit("VERSION={} but {}".format(version, mismatched))
          print("version mirrors agree on", version)
          PY

      - name: Run offline skill tests
        run: python -m unittest discover -s skill/annas-api/tests -v

      - name: Build archive and checksums
        id: build
        env:
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import zipfile

          root = pathlib.Path("skill/annas-api")
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          zip_name = os.environ["ZIP"]
          target = dist / zip_name

          members = sorted(
              path for path in root.rglob("*")
              if path.is_file() and "__pycache__" not in path.parts and path.suffix != ".pyc"
          )
          # Fixed timestamps keep the archive byte-identical for identical content,
          # so the published checksum is reproducible.
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in members:
                  info = zipfile.ZipInfo("annas-api/" + path.relative_to(root).as_posix(),
                                         date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, path.read_bytes())

          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          # Stable alias so a fixed filename resolves within this release.
          (dist / "annas-api-skill.zip").write_bytes(target.read_bytes())
          for name in (zip_name, "annas-api-skill.zip"):
              with (dist / (name + ".sha256")).open("w", encoding="utf-8", newline="\n") as handle:
                  handle.write("{}  {}\n".format(digest, name))

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8",
                                                             newline="\n") as handle:
              handle.write("digest={}\n".format(digest))
          print("packaged {} files into {}".format(len(members), zip_name))
          for path in members:
              print("  annas-api/" + path.relative_to(root).as_posix())
          print("sha256", digest)
          PY

      - name: Write latest.json and release notes
        env:
          ZIP: ${{ steps.version.outputs.zip }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASED_AT: ${{ steps.version.outputs.released_at }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          digest = os.environ["DIGEST"]
          zip_name = os.environ["ZIP"]
          base = "https://github.com/{}/releases/download/{}".format(repo, tag)

          manifest = {
              "name": "annas-api",
              "version": version,
              "tag": tag,
              "released_at": os.environ.get("RELEASED_AT"),
              "asset_name": zip_name,
              "zip_url": "{}/{}".format(base, zip_name),
              "sha256_url": "{}/{}.sha256".format(base, zip_name),
              "sha256": digest,
              "release_url": "https://github.com/{}/releases/tag/{}".format(repo, tag),
          }
          manifest = {k: v for k, v in manifest.items() if v}
          with pathlib.Path("dist/latest.json").open("w", encoding="utf-8", newline="\n") as handle:
              handle.write(json.dumps(manifest, indent=2) + "\n")

          lines = [
              "Agent Skill `annas-api` v{} — asynchronous search and verified downloads.".format(version),
              "",
              "| Asset | File |",
              "| --- | --- |",
              "| Skill archive | `{}` |".format(zip_name),
              "| Checksum | `{}.sha256` |".format(zip_name),
              "| Update manifest | `latest.json` |",
              "",
              "### Install",
              "",
              "```bash",
              "curl -L -o annas-api-skill.zip {}/{}".format(base, zip_name),
              "curl -L -o annas-api-skill.zip.sha256 {}/{}.sha256".format(base, zip_name),
              "sha256sum -c annas-api-skill.zip.sha256",
              "unzip annas-api-skill.zip -d ~/.claude/skills/",
              "```",
              "",
              "`sha256sum: {}`".format(digest),
              "",
              "### Update check",
              "",
              "```bash",
              "python annas-api/scripts/check_update.py --exit-code",
              "```",
          ]
          with pathlib.Path("release-notes.md").open("w", encoding="utf-8", newline="\n") as handle:
              handle.write("\n".join(lines) + "\n")
          print("wrote dist/latest.json and release-notes.md")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; refreshing assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "annas-api skill v$VERSION" \
              --notes-file release-notes.md \
              --latest=false
          fi
          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[].name)'

name: annas-api

services:
  annas-api:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${ANNAS_API_PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./annas_api:/app/annas_api:ro
      - annas-api-data:/data
    networks:
      annas-api-net:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  annas-api-data:

networks:
  annas-api-net:
    name: annas-api-net
    ipam:
      config:
        - subnet: 172.20.0.0/24
